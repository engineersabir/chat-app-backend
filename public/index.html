<!DOCTYPE html>
<html>
<head>
  <title>Chat App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      height: 600px;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      border-radius: 10px 10px 0 0;
      text-align: center;
    }
    .header h1 { font-size: 24px; margin-bottom: 5px; }
    .header p { font-size: 12px; opacity: 0.9; }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #f8f9fa;
    }
    .message {
      margin-bottom: 12px;
      padding: 10px 15px;
      border-radius: 8px;
      max-width: 85%;
      word-wrap: break-word;
    }
    .user-message {
      background: #667eea;
      color: white;
      margin-left: auto;
      text-align: right;
    }
    .bot-message {
      background: #e9ecef;
      color: #333;
    }
    .system-message {
      background: #d4edda;
      color: #155724;
      text-align: center;
      font-size: 12px;
      max-width: 100%;
    }
    .message-time {
      font-size: 11px;
      opacity: 0.7;
      margin-top: 5px;
    }
    .input-area {
      padding: 15px;
      border-top: 1px solid #ddd;
      display: flex;
      gap: 10px;
    }
    input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 14px;
    }
    input:focus { outline: none; border-color: #667eea; }
    button {
      padding: 10px 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }
    button:hover { transform: scale(1.05); }
    .loading {
      text-align: center;
      color: #667eea;
      padding: 20px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>💬 Chat App</h1>
      <p>Real-time Messaging with Message History</p>
    </div>
    <div id="messages"></div>
    <div class="input-area">
      <input type="text" id="username" placeholder="Your name" value="Ghulam Sabir" />
      <input type="text" id="message" placeholder="Type message..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script>
    const socket = io();
    const messagesDiv = document.getElementById('messages');

    // Load message history on page load
    async function loadMessageHistory() {
      try {
        const response = await fetch('/api/messages');
        const messages = await response.json();
        messages.forEach(msg => {
          displayMessage(msg.username, msg.message, msg.timestamp, 'history');
        });
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      } catch (err) {
        console.log('Error loading messages:', err);
      }
    }

    // Load history on connect
    window.addEventListener('load', loadMessageHistory);

    socket.on('connect', () => {
      addSystemMessage('✅ Connected to server');
    });

    socket.on('receive_message', (data) => {
      const isBot = data.username.includes('🤖');
      displayMessage(data.username, data.message, new Date(), isBot ? 'bot' : 'user');
    });

    socket.on('disconnect', () => {
      addSystemMessage('❌ Disconnected from server');
    });

    function displayMessage(username, text, timestamp, type = 'user') {
      const div = document.createElement('div');
      div.className = 'message';
      
      if (type === 'system') {
        div.classList.add('system-message');
        div.innerHTML = text;
      } else {
        div.classList.add(type === 'bot' || type === 'history' && username.includes('🤖') ? 'bot-message' : 'user-message');
        const time = new Date(timestamp).toLocaleTimeString();
        div.innerHTML = `<b>${username}</b><br>${text}<div class="message-time">${time}</div>`;
      }
      
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function addSystemMessage(text) {
      const div = document.createElement('div');
      div.className = 'message system-message';
      div.textContent = text;
      messagesDiv.appendChild(div);
    }

    function sendMessage() {
      const username = document.getElementById('username').value || 'Anonymous';
      const message = document.getElementById('message').value.trim();
      
      if (!message) return;
      
      socket.emit('send_message', { username, message });
      displayMessage(username, message, new Date());
      document.getElementById('message').value = '';
      document.getElementById('message').focus();
    }

    document.getElementById('message').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
