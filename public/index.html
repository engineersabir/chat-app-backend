<!DOCTYPE html>
<html>
<head>
  <title>Chat App</title>
  <style>
    body { font-family: Arial; max-width: 600px; margin: 50px auto; background: #f5f5f5; }
    #messages { border: 2px solid #007bff; height: 350px; overflow-y: auto; padding: 15px; margin-bottom: 15px; background: white; border-radius: 5px; }
    .message { margin: 8px 0; padding: 10px; background: #e7f3ff; border-left: 4px solid #007bff; border-radius: 3px; }
    input { width: 70%; padding: 10px; margin-right: 5px; border: 1px solid #ddd; border-radius: 3px; }
    button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; border-radius: 3px; font-weight: bold; }
    button:hover { background: #0056b3; }
    h1 { color: #007bff; }
  </style>
</head>
<body>
  <h1>💬 Real-Time Chat App</h1>
  <div id="messages"></div>
  <div>
    <input type="text" id="username" placeholder="Enter your name" value="Ghulam Sabir" />
    <input type="text" id="message" placeholder="Type message..." />
    <button onclick="sendMessage()">Send</button>
  </div>

  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script>
    const socket = io();
    
    socket.on('connect', () => {
      addMessage('✅ Connected to server', 'System');
    });

    socket.on('receive_message', (data) => {
      addMessage(data.message, data.username);
    });

    socket.on('disconnect', () => {
      addMessage('❌ Disconnected', 'System');
    });

    function sendMessage() {
      const username = document.getElementById('username').value || 'Anonymous';
      const message = document.getElementById('message').value.trim();
      
      if (message === '') return;
      
      socket.emit('send_message', { username, message });
      addMessage(message, username);
      document.getElementById('message').value = '';
      document.getElementById('message').focus();
    }

    function addMessage(text, sender) {
      const div = document.createElement('div');
      div.className = 'message';
      div.innerHTML = `<b>${sender}:</b> ${text}`;
      document.getElementById('messages').appendChild(div);
      document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    }

    document.getElementById('message').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
